name: Site checks and production deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy current main or restore its previous production release
        type: choice
        options: [deploy, rollback]
        default: deploy
      expected_release:
        description: For rollback only, exact CURRENT release ID shown in the deployment summary
        type: string
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: Validate and package
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check HTML, local links, JSON-LD and JavaScript
        run: python3 scripts/check_site.py
      - name: Check PHP syntax
        run: php -l send-request.php
      - name: Test deployment integrity and rollback
        run: python3 -m unittest discover -s tests -v
      - name: Package public files
        env:
          RELEASE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/build_release.py --revision "$GITHUB_SHA" --run-id "$RELEASE_RUN"
      - name: Store the tested deployment artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/site.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to promoznachki.ru
    needs: checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://promoznachki.ru/
    concurrency:
      group: promoznachki-production
      cancel-in-progress: false
    steps:
      - name: Check out deployment tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact tested artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Skip a commit superseded while waiting for deployment
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this release was skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish and verify, automatically restore on failure
        if: steps.latest.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy.sh

  rollback:
    name: Restore previous production release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' && inputs.operation == 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://promoznachki.ru/
    concurrency:
      group: promoznachki-production
      cancel-in-progress: false
    steps:
      - name: Check out deployment tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restore only if production still matches the specified release
        env:
          EXPECTED_RELEASE: ${{ inputs.expected_release }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy.sh rollback
